mission:
  overall_goal: >
    Menciptakan strategi konten media berbasis data untuk meningkatkan 
    jangkauan dan engagement audiens target pada platform sosial, dengan 
    fokus pada analisis tren, produksi konten relevan, review editorial, 
    dan laporan publikasi.

agents:
  - role: Media Analyst
    goal: >
      Identifikasi tren konten, topik hangat, dan perilaku audiens di media 
      sosial terkait teknologi dan AI.
    backstory: >
      Ahli analisis media sosial yang memahami tren terkini, pola engagement, 
      dan algoritma platform. Mampu mengubah data menjadi wawasan yang dapat 
      ditindaklanjuti.
    tools:
      - x_search
      - market_data_ticker
    verbose: true
    max_iter: 5

  - role: Content Writer
    goal: >
      Menulis 3 draft konten media sosial yang menarik dan actionable 
      berdasarkan hasil analisis tren.
    backstory: >
      Penulis konten kreatif yang mahir membuat micro-copy persuasif dan 
      relevan untuk audiens teknologi. Selalu menyertakan call-to-action yang kuat.
    tools: []
    verbose: true
    max_iter: 5

  - role: Content Editor
    goal: >
      Review dan evaluasi draft konten untuk memastikan kualitas, akurasi, 
      dan keselarasan pesan sebelum disetujui untuk rilis.
    backstory: >
      Editor konten berpengalaman yang teliti terhadap nada, tata bahasa, 
      dan nilai pesan. Memberikan penilaian objektif (DISETUJUI / REVISI).
    tools:
      - discord_tool
    verbose: true
    max_iter: 5

  - role: Release Manager
    goal: >
      Menyusun laporan akhir dan rencana publikasi berdasarkan hasil review 
      editorial.
    backstory: >
      Manajer rilis yang bertugas memastikan semua materi konten yang disetujui 
      tercatat rapi dan mendistribusikan laporan final ke tim.
    tools:
      - discord_tool
    verbose: true
    max_iter: 5

tasks:
  - agent: Media Analyst
    description: >
      Lakukan analisis tren konten media sosial seputar topik: "{topic}".
      Target audiens: "{audience}".
      Gunakan x_search jika tersedia untuk mencari percakapan terkini.
      Sajikan 3 temuan tren utama beserta rekomendasi sudut pandang konten.
    expected_output: >
      Laporan berisi 3 temuan tren teratas terkait {topic}, analisis relevansi
      untuk {audience}, dan sudut pandang (angle) konten yang disarankan.

  - agent: Content Writer
    description: >
      Berdasarkan laporan analisis tren dari Media Analyst, buatlah 3 variasi 
      draft konten media sosial lengkap dengan hook yang menarik, isi poin utama, 
      dan call-to-action (CTA).
    expected_output: >
      3 draft konten media sosial siap review, masing-masing memiliki hook, body, 
      dan CTA yang jelas.
    context:
      - Media Analyst

  - agent: Content Editor
    description: >
      Periksa 3 draft konten dari Content Writer. Evaluasi kejelasan pesan, 
      tone of voice, dan daya tariknya. Berikan keputusan status untuk setiap draft 
      (DISETUJUI atau REVISI) beserta catatan singkat. Kirim status review ke Discord.
      Tunggu konfirmasi manusia sebelum lanjut ke rilis.
    expected_output: >
      Hasil review editorial untuk ketiga draft dengan status kelayakan publikasi 
      dan catatan perbaikan jika ada.
    human_input: true
    context:
      - Content Writer

  - agent: Release Manager
    description: >
      Kumpulkan draft yang telah DISETUJUI oleh Content Editor. Buat rekapitulasi 
      laporan akhir strategi konten dan kirimkan ringkasan rilis ke Discord via discord_tool.
    expected_output: >
      Laporan final strategi rilis konten dan konfirmasi pengiriman notifikasi ke Discord.
    context:
      - Content Editor

process: sequential
verbose: true
memory: false
cache: true

# Konfigurasi Model LLM untuk misi ini
llm:
  provider: openai                # Opsi: openai, ollama, openrouter, groq, anthropic, gemini
  model: "gpt-4o-mini"            # Nama model
  temperature: 0.7
  max_tokens: 4096
