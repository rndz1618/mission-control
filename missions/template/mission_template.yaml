mission:
  overall_goal: >
    [Tuliskan tujuan utama dari misi ini dalam 1-3 kalimat]

agents:
  - role: "[Nama Role Agen 1]"
    goal: >
      [Tujuan spesifik yang ingin dicapai oleh agen ini]
    backstory: >
      [Latar belakang keahlian agen untuk membentuk persona dan gaya analisis]
    tools:
      - discord_tool
    verbose: true
    max_iter: 5

  - role: "[Nama Role Agen 2]"
    goal: >
      [Tujuan spesifik agen kedua]
    backstory: >
      [Latar belakang keahlian agen kedua]
    tools: []
    verbose: true
    max_iter: 5

tasks:
  - agent: "[Nama Role Agen 1]"
    description: >
      [Deskripsi tugas detail yang harus dikerjakan oleh Agen 1]
    expected_output: >
      [Bentuk output yang diharapkan dari task ini]

  - agent: "[Nama Role Agen 2]"
    description: >
      [Deskripsi tugas Agen 2 yang memproses hasil dari Agen 1]
    expected_output: >
      [Bentuk output akhir yang diharapkan]
    context:
      - "[Nama Role Agen 1]"

process: sequential               # Opsi: sequential atau hierarchical
verbose: true
memory: false
cache: true

# Konfigurasi LLM untuk misi ini
llm:
  provider: openai                # Opsi: openai, ollama, openrouter, groq, anthropic, gemini
  model: "gpt-4o-mini"            # Nama model yang ingin digunakan
  temperature: 0.7
  max_tokens: 4096
